name = "github-dark"

[colors]
background = "#0d1117"
foreground = "#e6edf3"
selection_bg = "#264f78"
selection_fg = "#e6edf3"
overlay_bg = "#161b22"
status_bg = "#010409"
status_fg = "#848d97"
border = "#30363d"
window_focus_border = "#d29922"
search_match = { fg = "#0d1117", bg = "#d29922" }
dim = "#848d97"

[levels]
trace = "#848d97"
debug = "#2f81f7"
info = "#3fb950"
warn = "#d29922"
error = "#f85149"
fatal = "#a371f7"
unknown = "#e6edf3"

[ui]
timestamp = "#2f81f7"
key = "#79c0ff"
string = "#a5d6ff"
number = "#79c0ff"
bool = "#ff7b72"
null = "#848d97"
