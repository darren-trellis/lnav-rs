name = "github-light"

[colors]
background = "#ffffff"
foreground = "#1f2328"
selection = { fg = "#1f2328", bg = "#ddf4ff" }
overlay = { fg = "#1f2328", bg = "#f6f8fa" }
status = { fg = "#656d76", bg = "#f6f8fa" }
border = "#d0d7de"
window_focus_border = "#9a6700"
search_match = { fg = "#ffffff", bg = "#9a6700" }
dim = "#656d76"

[levels]
trace = "#656d76"
debug = "#0969da"
info = "#1a7f37"
warn = "#9a6700"
error = "#cf222e"
fatal = "#8250df"
unknown = "#1f2328"

[ui]
timestamp = "#0969da"
key = "#0550ae"
string = "#0a3069"
number = "#0550ae"
bool = "#cf222e"
null = "#656d76"
border_color = { fg = "#d0d7de", bg = "#ffffff" }
border_width = 1
border_padding = 1
