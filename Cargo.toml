[package]
name = "teleminator"
version = "0.1.0"
edition = "2024"
description = "Teleminator — a modern log and trace navigator (Rust + ratatui)"
license = "MIT"
readme = "README.md"

[dependencies]
anyhow = "1.0.104"
arboard = "3"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
crossterm = "0.29.0"
libc = "0.2"
notify = { version = "8.2.0", features = ["macos_kqueue"] }
ratatui = "0.30.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.4"
unicode-width = "0.2.2"
