[theme]
name = "catppuccin"

# [theme.levels]
# error = { fg = "#1e1e2e", bg = "#f38ba8" }

follow = true
wrap_details = true
line_numbers = false
relative_line_numbers = false
scroll_lines = 1
timestamp_format = "%H:%M:%S"

[[columns]]
source = "level"
width = 5
align = "center"

[[columns]]
source = "timestamp"

[[columns]]
source = "message"

[[columns]]
source = "annotations.url"

